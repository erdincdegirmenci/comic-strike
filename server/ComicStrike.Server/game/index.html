<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ComicStrike</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%92%A5%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="/assets/index-CHrgPOWw.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/rapier-DpxwuBBO.js">
    <link rel="modulepreload" crossorigin href="/assets/three-CsQSoM8B.js">
    <link rel="stylesheet" crossorigin href="/assets/index-DJMBP1Af.css">
  </head>
  <body class="in-menu">
    <canvas id="game"></canvas>
    <div id="halftone"></div>

    <div id="ui">
      <!-- YÜKLENİYOR -->
      <section id="screen-loading" class="screen">
        <h1 class="logo">COMIC<br />STRIKE</h1>
        <p id="loading-msg" class="blink">LOADING...</p>
      </section>

      <!-- ANA MENÜ -->
      <section id="screen-main" class="screen hidden">
        <h1 class="logo">COMIC<br />STRIKE</h1>
        <div class="panel menu">
          <label class="field">NAME<input id="inp-name" maxlength="16" placeholder="Takma adın" autocomplete="off" /></label>
          <button class="btn big" data-action="play">PLAY</button>
          <button class="btn alt" data-action="settings">SETTINGS</button>
          <p id="main-msg" class="msg"></p>
          <p id="server-status" class="server-status">● Sunucu kontrol ediliyor...</p>
        </div>
        <p class="controls-hint">WASD hareket · SHIFT koş · SPACE zıpla · SOL TIK ateş · R şarjör · TAB skor · ESC menü</p>
      </section>

      <!-- AYARLAR -->
      <section id="screen-settings" class="screen hidden">
        <div class="panel menu settings">
          <h2>SETTINGS</h2>
          <label class="field">MOUSE SENSITIVITY <b id="set-sens-val"></b><input id="set-sens" type="range" min="0.2" max="3" step="0.05" /></label>
          <label class="field">FOV <b id="set-fov-val"></b><input id="set-fov" type="range" min="60" max="100" step="1" /></label>
          <label class="field">VOLUME <b id="set-vol-val"></b><input id="set-vol" type="range" min="0" max="1" step="0.05" /></label>
          <label class="field">GRAPHICS
            <select id="set-quality">
              <option value="high">HIGH (gölgeler açık)</option>
              <option value="low">LOW (daha hızlı)</option>
            </select>
          </label>
          <button class="btn alt" data-action="back">BACK</button>
        </div>
      </section>

      <!-- DURAKLAT -->
      <section id="screen-pause" class="screen overlay hidden">
        <div class="panel menu">
          <h2 id="pause-title">PAUSED</h2>
          <button id="btn-resume" class="btn big" data-action="resume">RESUME</button>
          <button class="btn alt" data-action="settings">SETTINGS</button>
          <button class="btn alt" data-action="quit">MAIN MENU</button>
        </div>
      </section>

      <section id="screen-none" class="screen hidden"></section>
    </div>

    <!-- OYUN İÇİ ARAYÜZ -->
    <div id="hud" class="hidden">
      <div id="crosshair"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i></div>
      <div id="hitmarker"></div>
      <div id="damage-flash"></div>
      <div id="damage-dir"></div>

      <div id="topbar">
        <div id="score-red" class="score red">0</div>
        <div class="mid"><div id="timer">8:00</div><div id="score-limit">FIRST TO 30</div></div>
        <div id="score-blue" class="score blue">0</div>
      </div>

      <div id="killfeed"></div>
      <div id="ping"></div>

      <div id="health" class="hud-box">
        <span class="label">HP</span><b id="hp-val">100</b>
        <div class="bar"><div id="hp-bar"></div></div>
      </div>
      <div id="ammo" class="hud-box">
        <b id="ammo-val">30</b><span id="ammo-max">/ 30</span>
        <div id="reload-msg" class="hidden">RELOADING...</div>
      </div>

      <div id="center-msg"></div>
      <div id="comic-pop"></div>
      <div id="respawn" class="hidden">
        <p id="respawn-by"></p>
        <p>RESPAWN <b id="respawn-time">3</b></p>
      </div>
      <div id="scoreboard" class="hidden"></div>
      <div id="end-screen" class="hidden"></div>
    </div>

  </body>
</html>
